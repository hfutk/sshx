name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create_release:
    name: Create nightly release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create or update nightly release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: Automatic build from the main branch.
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    name: Build and upload (${{ matrix.os }})
    needs: create_release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v2
      - run: rustup toolchain install stable
      - uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release -p sshx

      - name: Show built binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ls -la target/release/sshx.exe
            echo "BINARY=target/release/sshx.exe" >> $GITHUB_ENV
          else
            ls -la target/release/sshx
            echo "BINARY=target/release/sshx" >> $GITHUB_ENV
          fi

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARY: ${{ env.BINARY }}
        run: |
          gh release upload nightly "$BINARY" --clobber
